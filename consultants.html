<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCU Consultant Pods</title>
<style>
:root{
  --bg:#f6f6f4; --card:#ffffff; --ink:#17181c; --muted:#8a8f98; --line:#ececea; --hair:#f2f2ef;
  --accent:#b07d1e; --accent-bg:#fdf3df;
  --green:#2e7d4f; --green-bg:#e7f5ec; --amber:#b07d1e; --amber-bg:#fdf3df; --red:#cf3d3d; --red-bg:#fdeaea;
  --podA:#f5f8ff; --podB:#f3faf5; --podC:#fdf8ef; --podD:#f8f5fd; --podE:#fdf4f6;
  --podAb:#5b76d8; --podBb:#3d9964; --podCb:#c98a2b; --podDb:#8b66c9; --podEb:#d4577a;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,-apple-system,"Segoe UI",system-ui,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;-webkit-font-smoothing:antialiased}
#layout{display:flex;min-height:100vh}
aside{width:78px;background:rgba(255,255,255,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-right:0.5px solid var(--line);display:flex;flex-direction:column;align-items:stretch;padding:.9rem 0;position:sticky;top:0;height:100vh;flex-shrink:0}
aside .logo{margin:0 auto 1.1rem;width:42px;height:42px;border-radius:13px;background:var(--accent-bg);color:var(--accent);font-weight:800;font-size:.68rem;display:flex;align-items:center;justify-content:center;letter-spacing:.03em}
aside button{background:none;border:0;color:var(--muted);font-family:inherit;cursor:pointer;padding:.45rem 0;display:flex;flex-direction:column;align-items:center;gap:.28rem;font-size:.58rem;font-weight:600;letter-spacing:.02em}
aside button .ic{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;transition:background .12s}
aside button .ic svg{width:19px;height:19px}
aside button:hover .ic{background:var(--hair)}
aside button.active{color:var(--ink)}
aside button.active .ic{background:var(--accent-bg);color:var(--accent)}
aside .aside-spacer{flex:1}
#content{flex:1;min-width:0}
#topbar{background:rgba(246,246,244,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:1rem 1.6rem .4rem;display:flex;align-items:center;gap:.7rem;position:sticky;top:0;z-index:45;min-height:56px;flex-wrap:wrap}
#topbar h1{font-size:1.35rem;margin:0;font-weight:700;letter-spacing:-.01em}
.spacer{flex:1}
.hbtn{background:var(--ink);color:#fff;border:0;border-radius:12px;padding:.52rem 1rem;font-weight:600;font-size:.82rem;cursor:pointer;font-family:inherit}
.hbtn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.hbtn:hover{filter:brightness(.95)}
#saveState{font-size:.72rem;font-weight:600;padding:.25rem .65rem;border-radius:999px}
#saveState.saved{color:var(--green);background:var(--green-bg)} #saveState.unsaved{color:var(--red);background:var(--red-bg)} #saveState.saving{color:var(--amber);background:var(--amber-bg)}
main{padding:.6rem 1.6rem 4rem;max-width:1550px}
.card{background:var(--card);border:0.5px solid var(--line);border-radius:18px;padding:1.1rem 1.3rem;margin-bottom:1rem}
h2{font-size:.72rem;margin:.1rem 0 .8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
button.btn{background:var(--ink);color:#fff;border:0;border-radius:12px;padding:.5rem 1rem;font-weight:600;font-size:.84rem;cursor:pointer;font-family:inherit}
button.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
button.btn:hover{filter:brightness(.96)}
.weekbar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.8rem}
.weekbar b{font-size:.95rem;min-width:215px;text-align:center;font-weight:700;letter-spacing:-.01em}
.navarrow{background:var(--card);border:1px solid var(--line);border-radius:999px;width:36px;height:36px;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;transition:background .12s}
.navarrow:hover{background:var(--hair)}
.rota-wrap{background:var(--card);border:0.5px solid var(--line);border-radius:18px;overflow-x:auto;max-width:100%}
table.rota{border-collapse:collapse;width:100%;min-width:880px}
table.rota th{background:var(--card);color:var(--muted);font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;padding:.6rem .6rem;text-align:left;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line);font-weight:700}
table.rota td{border-bottom:1px solid var(--hair);border-right:1px solid var(--hair);padding:.55rem .6rem;vertical-align:top}
table.rota td:last-child{border-right:0}
td.rowh{white-space:nowrap;width:110px;font-weight:700;font-size:.85rem}
td.rowh .sub{display:block;font-size:.6rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.rowh .bar{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.4rem}
.cell{cursor:pointer;border-radius:8px;padding:.15rem .4rem;display:inline-block;min-width:38px;font-weight:700;font-size:.9rem;letter-spacing:-.01em}
.cell:hover{background:var(--accent-bg)}
.cell.empty{color:#c9cbd1;font-weight:400}
.cell.diff{outline:1.5px dashed var(--amber);color:var(--amber)}
.cellwrap{display:flex;align-items:center;gap:.42rem}
.codpill{flex:0 0 auto;display:inline-block;width:42px;text-align:center;font-size:.55rem;border-radius:6px;padding:.14rem 0;font-weight:800;letter-spacing:.04em;background:var(--ink);color:#f1efe8;cursor:grab}
.codpill:active{cursor:grabbing}
.finbadge{flex:0 0 auto;display:inline-flex;align-items:center;gap:.26rem;font-size:.62rem;font-weight:800;color:var(--accent);letter-spacing:.03em}
.finbadge::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent)}
.cell[draggable="true"]{cursor:grab}
.cell[draggable="true"]:active{cursor:grabbing}
td.dropok{outline:2px dashed var(--accent);outline-offset:-3px}
select.cellsel{border:1px solid #dcdcd8;border-radius:9px;padding:.25rem .3rem;font-size:.8rem;font-family:inherit;background:#fff;max-width:100%}
#whoOverlay{position:fixed;inset:0;background:rgba(23,24,28,.35);display:flex;align-items:center;justify-content:center;z-index:60}
#whoOverlay .box{background:var(--card);border-radius:16px;padding:1.2rem 1.4rem;max-width:320px;width:90%}
#whoOverlay b{display:block;margin-bottom:.6rem}
#whoOverlay select{width:100%;margin-bottom:.7rem}
tr.junrow td{background:#fafaf8;border-bottom:1px solid var(--hair);font-size:.74rem;color:#5a5f68;padding:.3rem .6rem}
tr.junrow td.rowh{font-weight:700;font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.legend{font-size:.76rem;color:var(--muted);margin:.6rem 0 0;display:flex;gap:1rem;flex-wrap:wrap}
table.plain{border-collapse:collapse;width:100%}
table.plain th{text-align:left;font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:.45rem .5rem;border-bottom:1px solid var(--line);font-weight:700}
table.plain td{padding:.45rem .5rem;border-bottom:1px solid var(--hair);font-size:.85rem}
.warnpc{color:var(--amber);font-weight:700}
.inipill{display:inline-block;background:var(--hair);border-radius:8px;padding:.05rem .4rem;font-size:.72rem;font-weight:700;color:var(--muted);margin-left:.35rem}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2c2c2a;color:#fff;padding:8px 16px;border-radius:10px;font-size:13px;display:none;z-index:50}
.logrow{display:flex;gap:.6rem;padding:.4rem 0;border-bottom:1px solid var(--hair);font-size:.8rem}
.logrow .lt{color:var(--muted);white-space:nowrap;font-size:.72rem;margin-top:.1rem}
/* Desktop: the pod labels stay put while the week scrolls sideways. */
@media(min-width:761px){
  table.rota td.rowh{position:sticky;left:0;z-index:6;background:var(--card);box-shadow:1px 0 0 var(--hair)}
  table.rota tr.junrow td.rowh{background:#fafaf8}
  table.rota th:first-child{position:sticky;left:0;z-index:12;background:var(--card)}
}
@media(max-width:760px){aside{display:none}main{padding:.6rem .7rem 4rem}#topbar{padding:.8rem .8rem .3rem}}
</style>
</head>
<body>
<div id="layout">
<aside>
  <div class="logo">CCU</div>
  <button data-tab="rota" class="active"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></span>Pods</button>
  <button data-tab="fair"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h4l3-8 4 14 3-8h4"/></svg></span>Fairness</button>
  <button data-tab="staff"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.4"/><path d="M2.8 19.5c.8-3.3 3.3-5 6.2-5s5.4 1.7 6.2 5"/><path d="M15.5 5.5a3.2 3.2 0 011.6 6"/><path d="M17.6 14.6c2.2.5 3.7 2 4.2 4.4"/></svg></span>Totals</button>
  <button data-tab="log"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span>Log</button>
  <div class="aside-spacer"></div>
  <button data-tab="admin" class="smallb"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 00-.15-1.44l2-1.55-2-3.46-2.37.95a7 7 0 00-2.49-1.44L13.6 2.5h-3.2l-.39 2.56a7 7 0 00-2.49 1.44l-2.37-.95-2 3.46 2 1.55A7 7 0 005 12c0 .49.05.97.15 1.44l-2 1.55 2 3.46 2.37-.95a7 7 0 002.49 1.44l.39 2.56h3.2l.39-2.56a7 7 0 002.49-1.44l2.37.95 2-3.46-2-1.55c.1-.47.15-.95.15-1.44z"/></svg></span>Admin</button>
</aside>
<div id="content">
<div id="topbar">
  <div><h1>Consultant pods</h1><div style="font-size:.58rem;font-weight:800;letter-spacing:.09em;color:var(--accent);margin-top:-1px">CONSULTANT ROTA</div></div>
  <div class="spacer"></div>
  <button class="hbtn ghost" id="btnWho" style="font-size:.75rem;padding:.35rem .7rem;color:var(--muted)" title="Swaps are logged under this name — click to change"></button>
  <span id="saveState"></span>
  <button class="hbtn ghost" id="btnJuniors">Show juniors</button>
</div>
<main>
  <section id="tab-rota">
    <div class="weekbar">
      <button class="navarrow" id="btnPrev" title="Previous week"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <b id="weekTitle"></b>
      <button class="navarrow" id="btnNext" title="Next week"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="btn sec" id="btnToday" style="font-size:.78rem;padding:.35rem .7rem">This week</button>
    </div>
    <div class="rota-wrap"><div id="weekGrid"></div></div>
  </section>
  <section id="tab-fair" style="display:none">
    <div class="card"><h2>Pod A&amp;B vs C&amp;D — running totals (incl. pre-app history)</h2><div id="fairBox"></div></div>
  </section>
  <section id="tab-staff" style="display:none">
    <div class="card"><h2>Consultant staffing</h2><div id="staffBox"></div></div>
  </section>
  <section id="tab-log" style="display:none">
    <div class="card"><h2>Consultant change log</h2><div id="logBox"></div></div>
  </section>
  <section id="tab-admin" style="display:none">
    <div id="adminBox"></div>
  </section>
</main>
</div>
</div>
<div id="toast"></div>
<script>
const q = new URLSearchParams((location.hash || "").replace(/^#/, ""));
const READ = q.get("r"), SAVE = q.get("s"), CREAD = q.get("cr"), CSAVE = q.get("cs");
let data = null, cdata = null, showJun = false, curWeek = null, adminOpen = false, myOpen = "", rotaOpen = false;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toast = m => { const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 3000); };
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); };
const mondayOf = iso => { const d = new Date(iso + "T12:00:00"); const k = (d.getDay() + 6) % 7; d.setDate(d.getDate() - k); return d.toISOString().slice(0,10); };
const fmt = iso => new Date(iso + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" });
const nameOf = ini => (data.consRota && data.consRota.map && data.consRota.map[ini]) || ini;
const PODROWS = [["A","Pod A","var(--podAb)"],["B","Pod B","var(--podBb)"],["C","Pod C","var(--podCb)"],["D","Pod D","var(--podDb)"],["E","Pod E","var(--podEb)"]];
const state = t => { const s = $("#saveState"); s.className = t; s.textContent = t === "saved" ? "Saved" : t === "saving" ? "Saving…" : "Save failed"; };

function weeksAvail(){ return Object.keys((data || {}).weeks || {}).sort(); }

async function load(){
  if (!READ){ $("#weekGrid").innerHTML = "<p style='padding:1rem'>No data key in the link — open this page from the shared Teams link.</p>"; return; }
  const r = await fetch(READ, { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}", cache: "no-store" });
  data = await r.json();
  const wks = weeksAvail();
  const thisMon = mondayOf(new Date().toISOString().slice(0,10));
  curWeek = wks.includes(thisMon) ? thisMon : (wks.find(w => w >= thisMon) || wks[wks.length - 1]);
  state("saved");
  whoBtn();
  await loadC();
  renderAll();
}

/* ── consultant store: a SEPARATE SharePoint file behind its own flow keys (cr/cs in the link).
   Holds personal data (job plans, totals, PINs, skills, tariff) the trainee link can never reach. */
function seedC(){
  return { v: 1, adminPin: "", rotaPin: "", pins: {}, admins: ["AJC"],
           jobPlans: {}, skills: {},
           tariff: { "Day 17": 1, "Day 18": 1.25, "COD": 1.5, "Overnight OC": 2, "Weekend 24h": 3, "Weekend LD": 1.5, "Weekend SD": 1, "Anaesthesia list": 1, "FGH day": 1 },
           log: [] };
}
async function loadC(){
  if (!CREAD){ cdata = null; return; }
  try {
    const r = await fetch(CREAD, { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}", cache: "no-store" });
    if (!r.ok) throw 0;
    const j = await r.json();
    cdata = (j && j.v) ? j : seedC();
  } catch(e){ cdata = seedC(); }
}
async function saveC(){
  if (!CSAVE || !cdata) return;
  cdata.savedAt = new Date().toISOString();
  try { await fetch(CSAVE, { method: "POST", mode: "no-cors", body: new Blob([JSON.stringify(cdata)], { type: "application/json" }) }); toast("Saved"); }
  catch(e){ toast("Save failed — try again"); }
}
async function sha(s){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}
function clog(msg){
  const who = localStorage.getItem("consEditor") || "?";
  cdata.log = cdata.log || [];
  cdata.log.unshift({ t: new Date().toISOString(), who, msg });
  if (cdata.log.length > 300) cdata.log.length = 300;
}

function renderAdmin(){
  const box = $("#adminBox");
  if (!CREAD){
    box.innerHTML = "<div class='card'><h2>Connect the consultant store</h2>" +
      "<p style='font-size:.85rem'>Paste the two flow URLs (Consultant Data - Read and - Save) and this builds the full link for this page.</p>" +
      "<input type='text' id='cnR' placeholder='Read flow URL' style='width:100%;margin-bottom:.5rem'>" +
      "<input type='text' id='cnS' placeholder='Save flow URL' style='width:100%;margin-bottom:.7rem'>" +
      "<button class='btn' id='cnGo'>Build link</button>" +
      "<input type='text' id='cnOut' readonly style='width:100%;margin-top:.7rem;display:none' onclick='this.select()'></div>";
    $("#cnGo").onclick = () => {
      const cr = $("#cnR").value.trim(), cs = $("#cnS").value.trim();
      if (!cr || !cs) return;
      const o = $("#cnOut");
      o.value = location.origin + location.pathname + "#r=" + encodeURIComponent(READ || "") + "&s=" + encodeURIComponent(SAVE || "") + "&cr=" + encodeURIComponent(cr) + "&cs=" + encodeURIComponent(cs);
      o.style.display = "block"; o.select();
      try { navigator.clipboard.writeText(o.value); toast("Link copied — replace the Teams link with it"); } catch(e){}
    };
    return;
  }
  if (!adminOpen){
    const first = !cdata.adminPin;
    box.innerHTML = "<div class='card' style='max-width:340px'><h2>" + (first ? "Set the admin PIN" : "Admin") + "</h2>" +
      "<input type='password' id='apw' placeholder='PIN' style='width:100%;margin-bottom:.6rem'>" +
      (first ? "<input type='password' id='apw2' placeholder='PIN again' style='width:100%;margin-bottom:.6rem'>" : "") +
      "<button class='btn' id='ago' style='width:100%'>" + (first ? "Set and open" : "Unlock") + "</button>" +
      "<div id='amsg' style='font-size:.78rem;color:var(--red);min-height:1em;margin-top:.3rem'></div></div>";
    $("#ago").onclick = async () => {
      const p = $("#apw").value;
      if (first){
        if (!p || p !== ($("#apw2") || {}).value){ $("#amsg").textContent = "PINs don't match"; return; }
        cdata.adminPin = await sha(p); clog("Admin PIN set"); await saveC(); adminOpen = true; renderAdmin();
      } else if (await sha(p) === cdata.adminPin){ adminOpen = true; renderAdmin(); }
      else $("#amsg").textContent = "Wrong PIN";
    };
    return;
  }
  const inis = consList();
  const jp = i => cdata.jobPlans[i] = cdata.jobPlans[i] || { weeklyPA: "", annualTarget: "", lastYear: "", carryOver: "" };
  const sk = i => cdata.skills[i] = cdata.skills[i] || { neuro: false, ugi: false, endo: false };
  let h = "<div class='card'><h2>Job plans</h2><table class='plain'><tr><th>Consultant</th><th>Weekly PAs</th><th>Annual target</th><th>Last year</th><th>Carry-over</th></tr>";
  for (const i of inis){
    const p = jp(i);
    h += "<tr><td>" + esc(nameOf(i)) + "<span class='inipill'>" + i + "</span></td>" +
      ["weeklyPA","annualTarget","lastYear","carryOver"].map(k =>
        "<td><input type='text' inputmode='decimal' data-jp='" + i + "' data-k='" + k + "' value='" + esc(p[k]) + "' style='width:72px'></td>").join("") + "</tr>";
  }
  h += "</table></div>";
  h += "<div class='card'><h2>List skills</h2><table class='plain'><tr><th>Consultant</th><th>Neuro</th><th>Upper GI</th><th>Endoscopy</th></tr>";
  for (const i of inis){
    const s = sk(i);
    h += "<tr><td>" + esc(nameOf(i)) + "<span class='inipill'>" + i + "</span></td>" +
      ["neuro","ugi","endo"].map(k => "<td><input type='checkbox' data-sk='" + i + "' data-k='" + k + "'" + (s[k] ? " checked" : "") + "></td>").join("") + "</tr>";
  }
  h += "</table></div>";
  h += "<div class='card'><h2>PA tariff per shift</h2><table class='plain'>";
  for (const k of Object.keys(cdata.tariff)) h += "<tr><td>" + esc(k) + "</td><td><input type='text' inputmode='decimal' data-tf='" + esc(k) + "' value='" + esc(cdata.tariff[k]) + "' style='width:72px'></td></tr>";
  h += "</table></div>";
  h += "<div class='card'><h2>Admins</h2><input type='text' id='admList' value='" + esc((cdata.admins || []).join(", ")) + "' style='width:100%'></div>";
  box.innerHTML = h;
  box.querySelectorAll("input[data-jp]").forEach(x => x.onchange = () => { jp(x.dataset.jp)[x.dataset.k] = x.value.trim(); clog("Job plan " + x.dataset.jp + " " + x.dataset.k + " → " + x.value.trim()); saveC(); });
  box.querySelectorAll("input[data-sk]").forEach(x => x.onchange = () => { sk(x.dataset.sk)[x.dataset.k] = x.checked; clog("Skill " + x.dataset.sk + " " + x.dataset.k + " → " + x.checked); saveC(); });
  box.querySelectorAll("input[data-tf]").forEach(x => x.onchange = () => { cdata.tariff[x.dataset.tf] = x.value.trim(); clog("Tariff " + x.dataset.tf + " → " + x.value.trim()); saveC(); });
  $("#admList").onchange = () => { cdata.admins = $("#admList").value.split(",").map(s => s.trim().toUpperCase()).filter(Boolean); clog("Admins → " + cdata.admins.join(", ")); saveC(); };
}

async function myFigures(ini){
  const p = (cdata.jobPlans || {})[ini] || {};
  const pin = (cdata.pins || {})[ini];
  const gate = document.createElement("div"); gate.id = "whoOverlay";
  const box = document.createElement("div"); box.className = "box";
  const t = document.createElement("b"); t.textContent = pin ? "PIN for " + ini : "Set a PIN for " + ini;
  const inp = document.createElement("input"); inp.type = "password"; inp.placeholder = "PIN"; inp.style.width = "100%"; inp.style.marginBottom = ".6rem";
  const ok = document.createElement("button"); ok.className = "btn"; ok.style.width = "100%"; ok.textContent = pin ? "Show my figures" : "Set PIN";
  ok.onclick = async () => {
    const v = inp.value; if (!v) return;
    if (!pin){ cdata.pins = cdata.pins || {}; cdata.pins[ini] = await sha(v); clog("PIN set for " + ini); await saveC(); }
    else if (await sha(v) !== pin){ t.textContent = "Wrong PIN"; return; }
    gate.remove();
    const shifts = (function(){ const days = ((data.consRota || {}).days) || {}; let n = 0; for (const d in days){ const c = days[d].cur || {}; if (["A","B","C","D","E"].some(k => c[k] === ini) || c.oncall === ini || c.fgh === ini) n++; } return n; })();
    const ov = document.createElement("div"); ov.id = "whoOverlay";
    const b2 = document.createElement("div"); b2.className = "box";
    b2.innerHTML = "<b>" + esc(nameOf(ini)) + "</b><table class='plain' style='margin-top:.5rem'>" +
      "<tr><td>Weekly PAs</td><td style='text-align:right'>" + esc(p.weeklyPA || "—") + "</td></tr>" +
      "<tr><td>Annual target</td><td style='text-align:right'>" + esc(p.annualTarget || "—") + "</td></tr>" +
      "<tr><td>Last year</td><td style='text-align:right'>" + esc(p.lastYear || "—") + "</td></tr>" +
      "<tr><td>Carry-over</td><td style='text-align:right'>" + esc(p.carryOver || "—") + "</td></tr>" +
      "<tr><td>Shift days in current window</td><td style='text-align:right'>" + shifts + "</td></tr></table>";
    ov.onclick = e => { if (e.target === ov) ov.remove(); };
    ov.append(b2); document.body.append(ov);
  };
  gate.onclick = e => { if (e.target === gate) gate.remove(); };
  box.append(t, inp, ok); gate.append(box); document.body.append(gate);
  inp.focus();
}

function consList(){
  const map = (data.consRota || {}).map || {};
  return Object.keys(map).filter(i => !["FMCN","NET","AC","SF"].includes(i)).sort((a,b) => nameOf(a).localeCompare(nameOf(b)));
}
function consSelect(cls, selected, blankLabel){
  const s = document.createElement("select"); s.className = cls;
  const b = document.createElement("option"); b.value = ""; b.textContent = blankLabel || "—"; s.append(b);
  for (const i of consList()){ const o = document.createElement("option"); o.value = i; o.textContent = i + " — " + nameOf(i); if (i === selected) o.selected = true; s.append(o); }
  if (selected && !consList().includes(selected)){ const o = document.createElement("option"); o.value = selected; o.textContent = selected; o.selected = true; s.append(o); }
  return s;
}
function whoBtn(){ const w = localStorage.getItem("consEditor"); $("#btnWho").textContent = w ? "Editing as " + w : "Who's editing?"; }
function pickWho(cb){
  const ov = document.createElement("div"); ov.id = "whoOverlay";
  const box = document.createElement("div"); box.className = "box";
  const t = document.createElement("b"); t.textContent = "Who are you? Changes are logged under your name.";
  const sel = consSelect("cellsel", localStorage.getItem("consEditor") || "", "choose…");
  const ok = document.createElement("button"); ok.className = "btn"; ok.style.width = "100%"; ok.textContent = "That's me";
  ok.onclick = () => { if (!sel.value) return; localStorage.setItem("consEditor", sel.value); whoBtn(); ov.remove(); if (cb) cb(sel.value); };
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  box.append(t, sel, ok); ov.append(box); document.body.append(ov);
}
$("#btnWho").onclick = () => pickWho();

function juniorsFor(dateISO){
  const wk = (data.weeks || {})[mondayOf(dateISO)];
  if (!wk) return null;
  const di = (new Date(dateISO + "T12:00:00").getDay() + 6) % 7;
  const day = wk.days && wk.days[di];
  if (!day) return null;
  const nm = id => { const s = (data.staff || []).find(x => x.id === id); return s ? s.name.split(" ").pop() : ""; };
  const out = { pods: {}, night: [] };
  for (const p of ["A","B","C","D","E"]) out.pods[p] = (((day.pods || {})[p] || {}).assign || []).map(a => nm(a.id)).filter(Boolean);
  out.night = [].concat((day.night || {}).AB || [], (day.night || {}).CDE || []).map(nm).filter(Boolean);
  return out;
}

function cellHTML(rec, key, d){
  const cur = (rec && rec.cur[key]) || "", auto = (rec && rec.auto[key]) || "";
  const diff = rec && cur !== auto;
  const fin = rec && (rec.cur.fin || {})[cur];
  const isCod = rec && cur && rec.cur.cod === cur && "ABCDE".includes(key);
  const podCell = "ABCDE".includes(key);
  let h = "<div class='cellwrap'><span class='cell" + (diff ? " diff" : "") + (cur ? "" : " empty") + "' data-d='" + d + "' data-k='" + key + "'" +
    (cur && podCell ? " draggable='true'" : "") + " title='" +
    esc(nameOf(cur) || "nobody assigned") + (fin ? " · finishes " + fin : "") + (diff ? " · MANUAL — sheet says " + esc(auto || "nobody") : "") +
    (cur && podCell ? " · drag onto another pod to swap" : "") + "'>" + (esc(cur) || "—") + "</span>";
  if (isCod) h += "<span class='codpill' draggable='true' data-d='" + d + "' title='COD — drag onto another pod on this day to hand over referrals'>COD</span>";
  else if (fin && cur){
    /* 17:00 is the normal finish, so it isn't drawn — only the exception gets a mark. */
    const t = fin.slice(0,2) === "17" ? "" : fin.slice(0,2) === "18" ? "18" : fin;
    if (t) h += "<span class='finbadge' title='finishes " + fin + "'>" + esc(t) + "</span>";
  }
  return h + "</div>";
}

function renderRota(){
  const cons = (data.consRota || {}).days || {};
  const dates = Array.from({length:7}, (_, i) => addDays(curWeek, i));
  $("#weekTitle").textContent = fmt(curWeek) + " – " + fmt(dates[6]) + " " + new Date(dates[6] + "T12:00:00").getFullYear();
  let h = "<table class='rota'><tr><th></th>" + dates.map((d,i) => "<th>" + DAYS[i] + " " + fmt(d) + "</th>").join("") + "</tr>";
  for (const [p, label, barcol] of PODROWS){
    h += "<tr><td class='rowh'><span class='bar' style='background:" + barcol + "'></span>" + label + "</td>";
    for (const d of dates) h += "<td style='background:var(--pod" + p + ")' data-date='" + d + "' data-pod='" + p + "'>" + cellHTML(cons[d], p, d) + "</td>";
    h += "</tr>";
    if (showJun){
      h += "<tr class='junrow'><td class='rowh'>juniors</td>";
      for (const d of dates){
        const j = juniorsFor(d);
        h += "<td>" + (j && j.pods[p].length ? esc(j.pods[p].join(", ")) : "—") + "</td>";
      }
      h += "</tr>";
    }
  }
  h += "<tr><td class='rowh'>On call<span class='sub'>16:00–09:00 · 24h wknd</span></td>";
  for (const d of dates) h += "<td>" + cellHTML(cons[d], "oncall", d) + "</td>";
  h += "</tr>";
  if (showJun){
    h += "<tr class='junrow'><td class='rowh'>night juniors</td>";
    for (const d of dates){ const j = juniorsFor(d); h += "<td>" + (j && j.night.length ? esc(j.night.join(", ")) : "—") + "</td>"; }
    h += "</tr>";
  }
  h += "<tr><td class='rowh'>Fairfield</td>";
  for (const d of dates) h += "<td>" + cellHTML(cons[d], "fgh", d) + "</td>";
  h += "</tr>";
  h += "</table>";
  $("#weekGrid").innerHTML = h;
  $("#weekGrid").querySelectorAll(".cell").forEach(c => c.onclick = () => editCell(c.dataset.d, c.dataset.k, c));
  /* Badge drag: a consultant carries their badge onto another pod and the two exchange pods.
     This is the ONE edit open to any consultant without unlocking — everything else is rota-master. */
  $("#weekGrid").querySelectorAll(".cell[draggable='true']").forEach(c => {
    c.ondragstart = e => { e.dataTransfer.setData("text/pod", c.dataset.d + "|" + c.dataset.k); e.dataTransfer.effectAllowed = "move"; };
  });
  /* COD pill drag: hand referrals to whoever covers the pod you drop it on (same day). */
  $("#weekGrid").querySelectorAll(".codpill").forEach(pill => {
    pill.ondragstart = e => { e.dataTransfer.setData("text/cod", pill.dataset.d); e.dataTransfer.effectAllowed = "move"; };
  });
  $("#weekGrid").querySelectorAll("td[data-pod]").forEach(td => {
    td.ondragover = e => {
      const t = e.dataTransfer.types;
      if (t.includes("text/cod") || t.includes("text/pod")) { e.preventDefault(); td.classList.add("dropok"); }
    };
    td.ondragleave = () => td.classList.remove("dropok");
    td.ondrop = e => {
      td.classList.remove("dropok");
      const pod = e.dataTransfer.getData("text/pod");
      if (pod){
        e.preventDefault();
        const [pd, pk] = pod.split("|");
        if (pd !== td.dataset.date) { toast("Swap within the same day"); return; }
        if (pk === td.dataset.pod) return;
        const rec = ((data.consRota || {}).days || {})[pd]; if (!rec) return;
        if (!rec.cur[td.dataset.pod]) { toast("Drop on a pod with someone to swap with"); return; }
        ensureWho(() => applySwap(pd, pk, td.dataset.pod));
        return;
      }
      const d = e.dataTransfer.getData("text/cod");
      if (!d || d !== td.dataset.date) { if (d) toast("Drop it on another pod on the same day"); return; }
      e.preventDefault();
      const rec = ((data.consRota || {}).days || {})[d]; if (!rec) return;
      const target = rec.cur[td.dataset.pod];
      if (!target) { toast("No consultant on that pod to take COD"); return; }
      if (target === rec.cur.cod) return;
      ensureRota(() => ensureWho(() => applyEdit(d, "cod", target, "COD handed to " + target + " (Pod " + td.dataset.pod + ")")));
    };
  });
}

function renderFair(){
  const cons = data.consRota || {};
  const fair = cons.fair || {}, win = cons.window || {};
  const inis = [...new Set([...Object.keys(fair), ...Object.keys(win)])];
  const rows = inis.map(i => {
    const ab = ((fair[i] || {}).ab || 0) + ((win[i] || {}).ab || 0);
    const cd = ((fair[i] || {}).cd || 0) + ((win[i] || {}).cd || 0);
    return { i, ab, cd, t: ab + cd, pc: ab + cd ? Math.round(cd / (ab + cd) * 100) : null };
  }).filter(r => r.t).sort((a,b) => b.t - a.t);
  $("#fairBox").innerHTML = "<table class='plain'><tr><th>Consultant</th><th>A&amp;B days</th><th>C&amp;D (neuro) days</th><th>% neuro</th></tr>" +
    rows.map(r => "<tr><td>" + esc(nameOf(r.i)) + "<span class='inipill'>" + r.i + "</span></td><td>" + r.ab + "</td><td>" + r.cd +
      "</td><td" + (r.pc < 40 || r.pc > 60 ? " class='warnpc'" : "") + ">" + r.pc + "%</td></tr>").join("") + "</table>";
}

function renderStaff(){
  const cons = data.consRota || {}; const days = cons.days || {}; const map = cons.map || {};
  const tal = {};
  const bump = (ini, k) => { if (!ini) return; (tal[ini] = tal[ini] || { pod:0, oc:0, cod:0, fgh:0 })[k]++; };
  for (const d in days){
    const cur = days[d].cur || {};
    const podset = new Set();
    for (const p of ["A","B","C","D","E"]) if (cur[p]) podset.add(cur[p]);
    for (const i of podset) bump(i, "pod");
    bump(cur.oncall, "oc"); bump(cur.cod, "cod"); bump(cur.fgh, "fgh");
  }
  const inis = Object.keys(map).filter(i => !["FMCN","NET","AC","SF"].includes(i)).sort((a,b) => nameOf(a).localeCompare(nameOf(b)));
  $("#staffBox").innerHTML = "<table class='plain'><tr><th>Consultant</th><th>Initials</th><th>Pod days*</th><th>On call</th><th>COD</th><th>Fairfield</th>" + (cdata ? "<th></th>" : "") + "</tr>" +
    inis.map(i => { const t = tal[i] || { pod:0, oc:0, cod:0, fgh:0 };
      return "<tr><td>" + esc(nameOf(i)) + "</td><td><span class='inipill' style='margin:0'>" + i + "</span></td><td>" + t.pod + "</td><td>" + t.oc + "</td><td>" + t.cod + "</td><td>" + t.fgh + "</td>" +
        (cdata ? "<td><button data-my='" + i + "' style='border:1px solid var(--line);background:var(--card);border-radius:8px;padding:.2rem .55rem;font-size:.7rem;font-weight:600;cursor:pointer;font-family:inherit'>My figures</button></td>" : "") + "</tr>"; }).join("") +
    "</table><div style='font-size:.72rem;color:var(--muted);margin-top:.5rem'>*days covering at least one pod, across the window the app currently holds — the rota sheet remains the master.</div>";
  $("#staffBox").querySelectorAll("button[data-my]").forEach(b => b.onclick = () => myFigures(b.dataset.my));
}

function renderLog(){
  const rows = (data.log || []).filter(x => /consultant|on call/i.test(x.msg || "") || /consultant page/i.test(x.who || ""));
  $("#logBox").innerHTML = rows.length ? rows.slice(0,200).map(x =>
    "<div class='logrow'><span class='lt'>" + esc(new Date(x.t).toLocaleString("en-GB", { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" })) + "</span><span><b style='font-weight:600'>" + esc(x.who || "") + "</b> — " + esc(x.msg) + "</span></div>").join("")
    : "<p style='color:var(--muted);font-size:.85rem'>No consultant changes logged yet.</p>";
}

function renderAll(){ renderRota(); renderFair(); renderStaff(); renderLog(); renderAdmin(); }

function ensureWho(cb){
  const w = localStorage.getItem("consEditor");
  if (w) cb(w); else pickWho(cb);
}

const rowLabel = k => k.length === 1 ? "Pod " + k : k === "oncall" ? "on call" : k === "cod" ? "COD" : "Fairfield";

async function applyEdit(d, k, ini, note){
  const cons = data.consRota; if (!cons) return;
  const blank = () => ({ A:"",B:"",C:"",D:"",E:"",oncall:"",cod:"",fgh:"",wkend:false,fin:{} });
  const rec = cons.days[d] || (cons.days[d] = { auto: blank(), cur: blank() });
  const who = localStorage.getItem("consEditor") || "?";
  const cur = rec.cur[k] || "";
  if (ini === cur) return;
  rec.cur[k] = ini;
  data.log = data.log || [];
  data.log.unshift({ t: new Date().toISOString(), who: who + " (consultant page)", msg: (note || ("Consultant swap " + d + " " + rowLabel(k) + ": " + (cur || "—") + " → " + (ini || "—"))) + (ini === (rec.auto[k] || "") ? "" : " (differs from rota sheet)") });
  if (data.log.length > 500) data.log.length = 500;
  data.savedAt = new Date().toISOString(); data.savedBy = who;
  state("saving");
  try {
    await fetch(SAVE, { method: "POST", mode: "no-cors", body: new Blob([JSON.stringify(data)], { type: "application/json" }) });
    state("saved");
    toast("Saved — " + (ini || "cleared") + (ini === (rec.auto[k] || "") ? "" : " (flagged: differs from the rota sheet)"));
  } catch(e){ state("unsaved"); toast("Save failed — try again"); }
  renderAll();
}

/* A pod-to-pod swap: the two consultants exchange pods for that day. Finish time and COD are
   held against the person, not the pod, so both badges travel with them automatically. */
async function applySwap(d, k1, k2){
  const cons = data.consRota; if (!cons) return;
  const rec = (cons.days || {})[d]; if (!rec) return;
  const a = rec.cur[k1] || "", b = rec.cur[k2] || "";
  if (!a || !b || a === b) return;
  rec.cur[k1] = b; rec.cur[k2] = a;
  const who = localStorage.getItem("consEditor") || "?";
  data.log = data.log || [];
  data.log.unshift({ t: new Date().toISOString(), who: who + " (consultant page)",
    msg: "Pod swap " + d + ": " + a + " " + rowLabel(k1) + " ↔ " + b + " " + rowLabel(k2) });
  if (data.log.length > 500) data.log.length = 500;
  data.savedAt = new Date().toISOString(); data.savedBy = who;
  state("saving");
  try {
    await fetch(SAVE, { method: "POST", mode: "no-cors", body: new Blob([JSON.stringify(data)], { type: "application/json" }) });
    state("saved"); toast(a + " ↔ " + b);
  } catch(e){ state("unsaved"); toast("Save failed — try again"); }
  renderAll();
}

/* Rota-master gate. Changing who covers what, handing over COD, on call and Fairfield are all
   rota-master edits. Pod-to-pod swaps are not gated. Until the consultant store is connected
   there is nowhere to keep the PIN, so the page behaves as it did before. */
function ensureRota(cb){
  if (rotaOpen || !cdata) { rotaOpen = true; return cb(); }
  const first = !cdata.rotaPin;
  const gate = document.createElement("div"); gate.id = "whoOverlay";
  const box = document.createElement("div"); box.className = "box";
  const t = document.createElement("b"); t.textContent = first ? "Set the rota-master PIN" : "Rota-master PIN";
  const inp = document.createElement("input"); inp.type = "password"; inp.placeholder = "PIN"; inp.style.width = "100%"; inp.style.marginBottom = ".6rem";
  const inp2 = document.createElement("input"); inp2.type = "password"; inp2.placeholder = "PIN again"; inp2.style.width = "100%"; inp2.style.marginBottom = ".6rem";
  const ok = document.createElement("button"); ok.className = "btn"; ok.style.width = "100%"; ok.textContent = first ? "Set PIN" : "Unlock";
  ok.onclick = async () => {
    const v = inp.value; if (!v) return;
    if (first){
      if (v !== inp2.value){ t.textContent = "PINs don't match"; return; }
      cdata.rotaPin = await sha(v); clog("Rota-master PIN set"); await saveC();
    } else {
      const h = await sha(v);
      if (h !== cdata.rotaPin && h !== cdata.adminPin){ t.textContent = "Wrong PIN"; return; }
    }
    rotaOpen = true; gate.remove(); cb();
  };
  gate.onclick = e => { if (e.target === gate) gate.remove(); };
  box.append(t, inp); if (first) box.append(inp2); box.append(ok);
  gate.append(box); document.body.append(gate);
  inp.focus();
}

function editCell(d, k, cellEl){
  ensureRota(() => ensureWho(() => {
    const rec = ((data.consRota || {}).days || {})[d];
    const cur = (rec && rec.cur[k]) || "";
    const sel = consSelect("cellsel", cur, "— nobody —");
    sel.title = "Who covers " + rowLabel(k) + " on " + fmt(d);
    cellEl.replaceWith(sel);
    sel.focus();
    let done = false;
    const finish = commit => { if (done) return; done = true; if (commit && sel.value !== cur) applyEdit(d, k, sel.value); else renderRota(); };
    sel.onchange = () => finish(true);
    sel.onblur = () => finish(false);
    sel.onkeydown = e => { if (e.key === "Escape") finish(false); };
  }));
}

function shiftWeek(n){
  const wks = weeksAvail();
  const i = wks.indexOf(curWeek);
  const target = wks[i + n];
  if (target){ curWeek = target; renderRota(); }
}
$("#btnPrev").onclick = () => shiftWeek(-1);
$("#btnNext").onclick = () => shiftWeek(1);
$("#btnToday").onclick = () => { const wks = weeksAvail(); const m = mondayOf(new Date().toISOString().slice(0,10)); if (wks.includes(m)){ curWeek = m; renderRota(); } };
$("#btnJuniors").onclick = () => { showJun = !showJun; $("#btnJuniors").textContent = showJun ? "Hide juniors" : "Show juniors"; renderRota(); };
document.querySelectorAll("aside button[data-tab]").forEach(b => b.onclick = () => {
  document.querySelectorAll("aside button[data-tab]").forEach(x => x.classList.toggle("active", x === b));
  for (const t of ["rota","fair","staff","log","admin"]) $("#tab-" + t).style.display = (b.dataset.tab === t) ? "" : "none";
});
load().catch(e => { $("#weekGrid").innerHTML = "<p style='padding:1rem'>Couldn't load: " + esc(e.message || e) + "</p>"; });
</script>
</body>
</html>
